services:
  # Container 1: your PHP app (built from your Dockerfile)
  app:
    build: .
    ports:
      - "8000:80"
    environment:
      DB_HOST: db
      DB_USER: classpulse
      DB_PASSWORD: classpulse
      DB_NAME: classpulse
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  # Container 2: MySQL (official image, nothing to build)
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: classpulse
      MYSQL_USER: classpulse
      MYSQL_PASSWORD: classpulse
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db_data: